    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    text-align: center;
  }
  .logo-wrap {
    width: 90px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    filter: drop-shadow(0 8px 20px rgba(201, 96, 48, 0.35));
  }
  h1 {
    color: #e8cfa0;
    font-size: 34px;
    margin: 0 0 8px;
    font-weight: 700;
  }
  h1 .brown { color: #a05a28; }
  p.tagline {
    max-width: 420px;
    line-height: 1.5;
    margin: 0 0 36px;
    color: #d4b880;
  }
  .stores {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 280px;
  }
  .store-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #1c1410;
    border: 1px solid #3a2810;
    border-radius: 12px;
    padding: 12px 18px;
    color: #e8cfa0;
    text-decoration: none;
    text-align: left;
    transition: border-color 0.15s;
  }
  .store-btn:hover { border-color: #c96030; }
  .store-btn svg { flex-shrink: 0; }
  .store-btn .label {
    display: flex;
    flex-direction: column;
    line-height: 1.25;
  }
  .store-btn .label small { font-size: 11px; color: #9c8560; }
  .store-btn .label strong { font-size: 16px; }

  .qr-section {
    margin-top: 44px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .qr-section img {
    background: #fff;
    padding: 10px;
    border-radius: 12px;
    width: 150px;
    height: 150px;
  }
  .qr-section span {
    font-size: 14px;
    color: #9c8560;
    max-width: 260px;
  }

  footer {
    margin-top: 48px;
    font-size: 13px;
  }
  footer a { color: #c96030; }
</style>
